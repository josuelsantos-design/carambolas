<!DOCTYPE html><html lang="pt-BR"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Jogo da Cobrinha - Com Tela Inicial</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { background-color: #0b0f19; color: #f0f6fc; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; } h1 { margin-bottom: 8px; font-size: 2rem; background: linear-gradient(45deg, #2ea043, #58a6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; } #score-board { font-size: 1.1rem; margin-bottom: 15px; display: flex; gap: 25px; background: rgba(22, 27, 34, 0.8); padding: 8px 18px; border-radius: 20px; border: 1px solid #30363d; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); } .high-score-container { color: #ffd700; font-weight: bold; } .canvas-container { position: relative; } canvas { background-color: #121824; border: 2px solid #30363d; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(46, 160, 67, 0.15); display: block; } .instructions { margin-top: 15px; font-size: 0.85rem; color: #8b949e; text-align: center; } </style></head><body> <h1>🐍 Jogo da Cobrinha</h1> <div id="score-board"> <div>Pontuação: <span id="score">0</span></div> <div class="high-score-container">🏆 Recorde: <span id="high-score">0</span></div> </div> <div class="canvas-container"> <canvas id="gameCanvas" width="400" height="400"></canvas> </div> <div class="instructions"> Use as <b>setas do teclado</b> ou as teclas <b>W, A, S, D</b> para jogar. </div> <script> const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d"); const scoreElement = document.getElementById("score"); const highScoreElement = document.getElementById("high-score"); const gridSize = 20; const tileCount = canvas.width / gridSize; let snake, food, dx, dy, nextDx, nextDy, score, gameInterval; let changingDirection = false; let gameState = "START"; // Estados possíveis: START, PLAYING, GAME_OVER let highScore = localStorage.getItem("snakeHighScore") || 0; highScoreElement.innerText = highScore; // Inicializa ou resgata o estado do menu inicial showStartScreen(); function initGame() { snake = [{ x: 10, y: 10 }]; food = { x: 15, y: 15 }; dx = 0; dy = 0; nextDx = 0; nextDy = 0; score = 0; scoreElement.innerText = score; changingDirection = false; } function main() { if (gameState !== "PLAYING") return; if (hasGameEnded()) { gameState = "GAME_OVER"; checkHighScore(); showGameOverScreen(); return; } changingDirection = false; dx = nextDx; dy = nextDy; clearCanvas(); drawFood(); moveSnake(); drawSnake(); gameInterval = setTimeout(main, 100); } function clearCanvas() { ctx.fillStyle = "#121824"; ctx.fillRect(0, 0, canvas.width, canvas.height); // Desenha grade de fundo sutil ctx.strokeStyle = "rgba(255, 255, 255, 0.03)"; ctx.lineWidth = 1; for (let i = 0; i < tileCount; i++) { ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke(); } } function showStartScreen() { clearCanvas(); // Título interno ctx.fillStyle = "#58a6ff"; ctx.font = "bold 24px 'Segoe UI', sans-serif"; ctx.textAlign = "center"; ctx.fillText("PRONTO PARA COMEÇAR?", canvas.width / 2, canvas.height / 2 - 20); // Subtítulo descritivo ctx.fillStyle = "#8b949e"; ctx.font = "14px 'Segoe UI', sans-serif"; ctx.fillText("Pressione qualquer comando para iniciar", canvas.width / 2, canvas.height / 2 + 20); } function showGameOverScreen() { // Fundo semi-transparente escuro sobre o último frame do jogo ctx.fillStyle = "rgba(11, 15, 25, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height); // Texto de Game Over ctx.fillStyle = "#ff7b72"; ctx.font = "bold 32px 'Segoe UI', sans-serif"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30); // Pontuação alcançada ctx.fillStyle = "#f0f6fc"; ctx.font = "16px 'Segoe UI', sans-serif"; ctx.fillText(`Você fez ${score} pontos!`, canvas.width / 2, canvas.height / 2 + 10); // Instrução para reiniciar ctx.fillStyle = "#58a6ff"; ctx.font = "14px 'Segoe UI', sans-serif"; ctx.fillText("Pressione qualquer comando para reiniciar", canvas.width / 2, canvas.height / 2 + 50); } function drawSnake() { snake.forEach((part, index) => { const isHead = index === 0; ctx.fillStyle = isHead ? "#3fb950" : "#238636"; ctx.beginPath(); ctx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2, isHead ? 6 : 4); ctx.fill(); }); } function moveSnake() { const head = { x: snake[0].x + dx, y: snake[0].y + dy }; snake.unshift(head); const hasEatenFood = head.x === food.x && head.y === food.y; if (hasEatenFood) { score += 10; scoreElement.innerText = score; if (score > highScore) { highScore = score; highScoreElement.innerText = highScore; } generateFood(); } else { snake.pop(); } } function generateFood() { food.x = Math.floor(Math.random() * tileCount); food.y = Math.floor(Math.random() * tileCount); snake.forEach(part => { if (part.x === food.x && part.y === food.y) generateFood(); }); } function drawFood() { const cx = (food.x * gridSize) + (gridSize / 2); const cy = (food.y * gridSize) + (gridSize / 2); ctx.fillStyle = "#ff7b72"; ctx.beginPath(); ctx.arc(cx, cy, gridSize / 2 - 2, 0, Math.PI * 2); ctx.fill(); } function hasGameEnded() { if (snake.length === 0) return false; const head = snake[0]; for (let i = 4; i < snake.length; i++) { if (snake[i].x === head.x && snake[i].y === head.y) return true; } return head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount; } function checkHighScore() { if (score > (localStorage.getItem("snakeHighScore") || 0)) { localStorage.setItem("snakeHighScore", score); } } window.addEventListener("keydown", changeDirection); function changeDirection(event) { const LEFT_KEY = 37; const RIGHT_KEY = 39; const UP_KEY = 38; const DOWN_KEY = 40; const keyPressed = event.keyCode; const key = event.key.toLowerCase(); const validKeys = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd']; const isActionKey = validKeys.includes(key) || [LEFT_KEY, RIGHT_KEY, UP_KEY, DOWN_KEY].includes(keyPressed); // Gerencia transições de estados de tela (Start ou Game Over) antes de processar movimento if ((gameState === "START" || gameState === "GAME_OVER") && isActionKey) { clearTimeout(gameInterval); initGame(); gameState = "PLAYING"; // Define direção padrão inicial baseada no comando pressionado para evitar travamento parado if (keyPressed === LEFT_KEY || key === 'a') { nextDx = -1; nextDy = 0; } else if (keyPressed === UP_KEY || key
