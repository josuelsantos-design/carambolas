<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Cobrinha - GitHub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #2a2b2b;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.8rem;
      color: #58a6ff;
    }
    #score-board {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }
    .canvas-container {
      position: relative;
    }
    canvas {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      display: block;
    }
    #start-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(22, 27, 34, 0.9);
      color: #58a6ff;
      padding: 15px 20px;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
    }
    .instructions {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <h1>🐍 Jogo da Cobrinha</h1>
  <div id="score-board">Pontuação: <span id="score">0</span></div>
  
  <div class="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="start-message">Pressione qualquer seta ou W, A, S, D para iniciar</div>
  </div>
  
  <div class="instructions">
    Use as **setas do teclado** ou as teclas **W, A, S, D** para jogar.
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const startMessage = document.getElementById("start-message");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let gameInterval;
    let changingDirection = false;
    let gameStarted = false;

    // Desenha o estado inicial parado na tela
    clearCanvas();
    drawFood();
    drawSnake();

    function main() {
      if (hasGameEnded()) {
        alert(`Game Over! Sua pontuação foi: ${score}`);
        document.location.reload();
        return;
      }

      changingDirection = false;
      dx = nextDx;
      dy = nextDy;

      clearCanvas();
      drawFood();
      moveSnake();
      drawSnake();

      gameInterval = setTimeout(main, 100);
    }

    function clearCanvas() {
      ctx.fillStyle = "#161b22";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#238636" : "#2ea043"; // Verde estilo GitHub
        ctx.strokeStyle = "#161b22";
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
        ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
      });
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      const hasEatenFood = head.x === food.x && head.y === food.y;
      if (hasEatenFood) {
        score += 10;
        scoreElement.innerText = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);

      snake.forEach(part => {
        const hasEaten = part.x === food.x && part.y === food.y;
        if (hasEaten) generateFood();
      });
    }

    function drawFood() {
      ctx.fillStyle = "#f85149"; // Vermelho
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
    }

    function hasGameEnded() {
      for (let i = 4; i < snake.length; i++) {
        if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
      }

      const hitLeftWall = snake[0].x < 0;
      const hitRightWall = snake[0].x >= tileCount;
      const hitTopWall = snake[0].y < 0;
      const hitBottomWall = snake[0].y >= tileCount;

      return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
    }

    window.addEventListener("keydown", changeDirection);

    function changeDirection(event) {
      const LEFT_KEY = 37;
      const RIGHT_KEY = 39;
      const UP_KEY = 38;
      const DOWN_KEY = 40;

      if (changingDirection) return;
      changingDirection = true;

      const keyPressed = event.keyCode;
      const key = event.key.toLowerCase();

      const goingUp = dy === -1;
      const goingDown = dy === 1;
      const goingRight = dx === 1;
      const goingLeft = dx === -1;

      // Se o jogo ainda não começou, inicia ao apertar um botão válido
      if (!gameStarted) {
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd', '37', '38', '39', '40'].includes(key) || [37, 38, 39, 40].includes(keyPressed)) {
          gameStarted = true;
          startMessage.style.display = "none"; // Esconde a mensagem
          main();
        }
      }

      if ((keyPressed === LEFT_KEY || key === 'a') && !goingRight) {
        nextDx = -1;
        nextDy = 0;
      }
      if ((keyPressed === UP_KEY || key === 'w') && !goingDown) {
        nextDx = 0;
        nextDy = -1;
      }
      if ((keyPressed === RIGHT_KEY || key === 'd') && !goingLeft) {
        nextDx = 1;
        nextDy = 0;
      }
      if ((keyPressed === DOWN_KEY || key === 's') && !goingUp) {
        nextDx = 0;
        nextDy = 1;
      }
    }
  </script>
</body>
</html>
