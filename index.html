<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Cobrinha - Estilo Google Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #f0f6fc;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 2rem;
      background: linear-gradient(45deg, #4d7fff, #58a6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    #score-board {
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      gap: 25px;
      background: rgba(22, 27, 34, 0.8);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid #30363d;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .high-score-container {
      color: #ffd700;
      font-weight: bold;
    }
    .canvas-container {
      position: relative;
    }
    canvas {
      background-color: #a2d149;
      border: 4px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(77, 127, 255, 0.15);
      display: block;
    }
    .instructions {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #8b949e;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🍏 Jogo da Cobrinha</h1>
  <div id="score-board">
    <div>Pontuação: <span id="score">0</span></div>
    <div class="high-score-container">🏆 Recorde: <span id="high-score">0</span></div>
  </div>
  <div class="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
  </div>
  <div class="instructions">
    Use as <b>setas do teclado</b> ou as teclas <b>W, A, S, D</b> para jogar.
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("high-score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake, food, dx, dy, nextDx, nextDy, score, gameInterval;
    let changingDirection = false;
    let gameState = "START"; 

    let highScore = localStorage.getItem("snakeHighScore") || 0;
    highScoreElement.innerText = highScore;

    showStartScreen();

    function initGame() {
      // Inicia com 3 segmentos para dar o efeito visual fluido de curva igual ao da foto
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      food = { x: 15, y: 10 };
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      scoreElement.innerText = score;
      changingDirection = false;
    }

    function main() {
      if (gameState !== "PLAYING") return;

      if (hasGameEnded()) {
        gameState = "GAME_OVER";
        checkHighScore();
        showGameOverScreen();
        return;
      }

      changingDirection = false;
      dx = nextDx;
      dy = nextDy;
      
      clearCanvas();
      drawFood();
      moveSnake();
      drawSnake();
      
      gameInterval = setTimeout(main, 110);
    }

    function clearCanvas() {
      // Desenha o padrão xadrez do fundo (alternando verde claro e escuro)
      for (let r = 0; r < tileCount; r++) {
        for (let c = 0; c < tileCount; c++) {
          if ((r + c) % 2 === 0) {
            ctx.fillStyle = "#aad751";
          } else {
            ctx.fillStyle = "#a2d149";
          }
          ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
        }
      }
    }

    function showStartScreen() {
      clearCanvas();
      ctx.fillStyle = "rgba(11, 15, 25, 0.4)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 22px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PRONTO PARA COMEÇAR?", canvas.width / 2, canvas.height / 2 - 20);

      ctx.fillStyle = "#e0e0e0";
      ctx.font = "14px 'Segoe UI', sans-serif";
      ctx.fillText("Pressione qualquer comando para iniciar", canvas.width / 2, canvas.height / 2 + 20);
    }

    function showGameOverScreen() {
      ctx.fillStyle = "rgba(11, 15, 25, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff7b72";
      ctx.font = "bold 32px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

      ctx.fillStyle = "#f0f6fc";
      ctx.font = "16px 'Segoe UI', sans-serif";
      ctx.fillText(`Você fez ${score} pontos!`, canvas.width / 2, canvas.height / 2 + 10);

      ctx.fillStyle = "#58a6ff";
      ctx.font = "14px 'Segoe UI', sans-serif";
      ctx.fillText("Pressione qualquer comando para reiniciar", canvas.width / 2, canvas.height / 2 + 50);
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        const isHead = index === 0;
        
        // Cor azul idêntica à imagem fornecida
        ctx.fillStyle = "#4d7fff"; 
        ctx.beginPath();
        
        // Retira os espaços internos do corpo para criar a sensação de corpo contínuo
        ctx.roundRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize, isHead ? 8 : 4);
        ctx.fill();

        // Lógica de renderização dos olhos baseada na direção atual de movimento
        if (isHead) {
          ctx.fillStyle = "#ffffff";
          
          let eye1X, eye1Y, eye2X, eye2Y;
          let pupil1X, pupil1Y, pupil2X, pupil2Y;
          
          if (dx === 1) { // Andando para a Direita
            eye1X = part.x * gridSize + 12; eye1Y = part.y * gridSize + 4;
            eye2X = part.x * gridSize + 12; eye2Y = part.y * gridSize + 12;
            pupil1X = eye1X + 2; pupil1Y = eye1Y + 2;
            pupil2X = eye2X + 2; pupil2Y = eye2Y + 2;
          } else if (dx === -1) { // Andando para a Esquerda
            eye1X = part.x * gridSize + 4; eye1Y = part.y * gridSize + 4;
            eye2X = part.x * gridSize + 4; eye2Y = part.y * gridSize + 12;
            pupil1X = eye1X - 1; pupil1Y = eye1Y + 2;
            pupil2X = eye2X - 1; pupil2Y = eye2Y + 2;
          } else if (dy === -1) { // Andando para Cima
            eye1X = part.x * gridSize + 4; eye1Y = part.y * gridSize + 4;
            eye2X = part.x * gridSize + 12; eye2Y = part.y * gridSize + 4;
            pupil1X = eye1X + 2; pupil1Y = eye1Y - 1;
            pupil2X = eye2X + 2; pupil2Y = eye2Y - 1;
          } else { // Andando para Baixo
            eye1X = part.x * gridSize + 4; eye1Y = part.y * gridSize + 12;
            eye2X = part.x * gridSize + 12; eye2Y = part.y * gridSize + 12;
            pupil1X = eye1X + 2; pupil1Y = eye1Y + 2;
            pupil2X = eye2X + 2; pupil2Y = eye2Y + 2;
          }

          // Esclera (Branco do Olho)
          ctx.beginPath();
          ctx.arc(eye1X + 2, eye1Y + 2, 3, 0, Math.PI * 2);
          ctx.arc(eye2X + 2, eye2Y + 2, 3, 0, Math.PI * 2);
          ctx.fill();

          // Pupila (Preto do Olho)
          ctx.fillStyle = "#000000";
          ctx.beginPath();
          ctx.arc(pupil1X, pupil1Y, 1.5, 0, Math.PI * 2);
          ctx.arc(pupil2X, pupil2Y, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);
      const hasEatenFood = head.x === food.x && head.y === food.y;
      if (hasEatenFood) {
        score += 10;
        scoreElement.innerText = score;
        if (score > highScore) {
          highScore = score;
          highScoreElement.innerText = highScore;
        }
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
      for(let part of snake) {
        if (part.x === food.x && part.y === food.y) {
          generateFood();
          break;
        }
      }
    }

    function drawFood() {
      const cx = (food.x * gridSize) + (gridSize / 2);
      const cy = (food.y * gridSize) + (gridSize / 2);
      const r = gridSize / 2 - 2;

      // Desenha o corpo redondo vermelho da Maçã
      ctx.fillStyle = "#e03e1a";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // Desenha o pequeno caule marrom na parte superior
      ctx.strokeStyle = "#322319";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r + 1);
      ctx.lineTo(cx + 1, cy - r - 3);
      ctx.stroke();
    }

    function hasGameEnded() {
      if (snake.length === 0) return false;
      const head = snake[0];
      for (let i = 1; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) return true;
      }
      return head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
    }

    function checkHighScore() {
      if (score > (localStorage.getItem("snakeHighScore") || 0)) {
        localStorage.setItem("snakeHighScore", score);
      }
    }

    window.addEventListener("keydown", changeDirection);

    function changeDirection(event) {
      const LEFT_KEY = 37;
      const RIGHT_KEY = 39;
      const UP_KEY = 38;
      const DOWN_KEY = 40;

      const keyPressed = event.keyCode;
      const key = event.key.toLowerCase();

      const validKeys = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'];
      const isActionKey = validKeys.includes(key) || [LEFT_KEY, RIGHT_KEY, UP_KEY, DOWN_KEY].includes(keyPressed);

      if ((gameState === "START" || gameState === "GAME_OVER") && isActionKey) {
