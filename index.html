
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jogo da cobrinha clássico feito com HTML, CSS e JavaScript puro. Jogue no navegador, no computador ou no celular.">
  <meta name="theme-color" content="#2b3345">
  <title>Cobrinha</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="aparelho">
    <h1 class="titulo">Cobrinha</h1>

    <section class="painel" aria-label="Placar">
      <div class="medidor">
        <span class="medidor__rotulo">Pontos</span>
        <output id="pontos" class="medidor__valor" aria-live="off">0</output>
      </div>
      <div class="medidor">
        <span class="medidor__rotulo">Recorde</span>
        <output id="recorde" class="medidor__valor">0</output>
      </div>
      <div class="medidor">
        <span class="medidor__rotulo">Nível</span>
        <output id="nivel" class="medidor__valor">1</output>
      </div>
    </section>

    <div class="tela-moldura">
      <canvas id="tela" aria-label="Tabuleiro do jogo da cobrinha" role="img"></canvas>
      <div id="sobreposicao" class="sobreposicao" role="dialog" aria-live="polite">
        <h2 id="sobreposicao-titulo" class="sobreposicao__titulo">Cobrinha</h2>
        <p id="sobreposicao-texto" class="sobreposicao__texto">Coma as frutas e não bata em nada.</p>
        <button id="botao-principal" class="botao botao--principal" type="button">Jogar</button>
      </div>
    </div>

    <section class="opcoes" aria-label="Opções">
      <label class="campo">
        <span>Modo</span>
        <select id="modo">
          <option value="paredes">Com paredes</option>
          <option value="atravessar">Atravessar bordas</option>
        </select>
      </label>
      <button id="botao-som" class="botao" type="button" aria-pressed="true">Som: ligado</button>
      <button id="botao-pausa" class="botao" type="button">Pausar</button>
    </section>

    <section class="direcional" aria-label="Controles na tela">
      <button class="seta seta--cima" type="button" data-dir="cima" aria-label="Cima">▲</button>
      <button class="seta seta--esquerda" type="button" data-dir="esquerda" aria-label="Esquerda">◀</button>
      <button class="seta seta--direita" type="button" data-dir="direita" aria-label="Direita">▶</button>
      <button class="seta seta--baixo" type="button" data-dir="baixo" aria-label="Baixo">▼</button>
    </section>

    <p class="dica">Setas ou WASD para mover. Espaço pausa, Enter reinicia, M liga ou desliga o som. No celular, deslize sobre o tabuleiro.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
